name: release-check

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  package-check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        npm-version: ["11.13.0", "12.0.2"]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install npm ${{ matrix.npm-version }}
        run: npm install --global npm@${{ matrix.npm-version }}

      - name: Run release checks (artifact-only)
        run: npm run release:check:quick
