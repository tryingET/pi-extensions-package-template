name: template-guardrails

on:
  pull_request:
  push:
    branches: [main]

jobs:
  guardrails:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Enforce template-source invariants
        shell: bash
        run: bash ./scripts/template-guardrails.sh

  smoke-test:
    runs-on: ubuntu-latest
    needs: guardrails
    steps:
      - uses: actions/checkout@v6

      - name: Check out pinned pi-extensions validation owner
        uses: actions/checkout@v6
        with:
          repository: tryingET/pi-extensions
          ref: e855d07799f7984770d8a7ce25fc8ebabe1b7e64
          path: .owner/pi-extensions

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Install copier
        shell: bash
        run: python -m pip install --upgrade pip copier

      - name: Prepare smoke forensics directory
        shell: bash
        run: mkdir -p .artifacts/smoke/tmp

      - name: Generate and validate smoke repo (standalone)
        shell: bash
        env:
          KEEP_SMOKE_DIR: "1"
          TMPDIR: ${{ github.workspace }}/.artifacts/smoke/tmp
        run: |
          set -o pipefail
          bash ./scripts/smoke-test-template.sh 2>&1 | tee .artifacts/smoke/smoke-standalone.log

      - name: Generate and validate smoke repo (monorepo-package)
        shell: bash
        env:
          KEEP_SMOKE_DIR: "1"
          SCAFFOLD_MODE: "monorepo-package"
          TMPDIR: ${{ github.workspace }}/.artifacts/smoke/tmp
          PI_EXTENSIONS_ROOT: ${{ github.workspace }}/.owner/pi-extensions
        run: |
          set -o pipefail
          bash ./scripts/smoke-test-template.sh 2>&1 | tee .artifacts/smoke/smoke-monorepo.log

      - name: Upload smoke forensics
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: smoke-forensics-${{ github.run_id }}-${{ github.run_attempt }}
          path: .artifacts/smoke
          if-no-files-found: ignore
          retention-days: 7

  generated-contract:
    runs-on: ubuntu-latest
    needs: guardrails
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: default
            repo_name: template-contract
            command_name: template-contract
          - id: dotted
            repo_name: template.contract
            command_name: feature-alpha
          - id: underscored
            repo_name: template_contract
            command_name: feature.beta
    env:
      FORENSICS_DIR: ${{ github.workspace }}/.artifacts/generated-contract/${{ matrix.id }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install copier
        shell: bash
        run: python -m pip install --upgrade pip copier

      - name: Prepare generated-contract forensics directory
        shell: bash
        run: mkdir -p "$FORENSICS_DIR/tmp"

      - name: Verify generated include/exclude contract (standalone)
        shell: bash
        env:
          CONTRACT_REPO_NAME: ${{ matrix.repo_name }}
          CONTRACT_COMMAND_NAME: ${{ matrix.command_name }}
          KEEP_CONTRACT_DIR: "1"
          TMPDIR: ${{ env.FORENSICS_DIR }}/tmp
        run: |
          set -o pipefail
          bash ./scripts/generated-contract-test.sh 2>&1 | tee "$FORENSICS_DIR/generated-contract-standalone.log"

      - name: Verify generated include/exclude contract (monorepo-package)
        shell: bash
        env:
          CONTRACT_REPO_NAME: ${{ matrix.repo_name }}
          CONTRACT_COMMAND_NAME: ${{ matrix.command_name }}
          KEEP_CONTRACT_DIR: "1"
          SCAFFOLD_MODE: "monorepo-package"
          TMPDIR: ${{ env.FORENSICS_DIR }}/tmp
        run: |
          set -o pipefail
          bash ./scripts/generated-contract-test.sh 2>&1 | tee "$FORENSICS_DIR/generated-contract-monorepo.log"

      - name: Upload generated-contract forensics
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: generated-contract-forensics-${{ matrix.id }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.FORENSICS_DIR }}
          if-no-files-found: ignore
          retention-days: 7

  idempotency:
    runs-on: ubuntu-latest
    needs: guardrails
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install copier
        shell: bash
        run: python -m pip install --upgrade pip copier

      - name: Prepare idempotency forensics directory
        shell: bash
        run: mkdir -p .artifacts/idempotency/tmp

      - name: Verify generated repo idempotency (standalone)
        shell: bash
        env:
          KEEP_IDEMPOTENCY_DIR: "1"
          TMPDIR: ${{ github.workspace }}/.artifacts/idempotency/tmp
        run: |
          set -o pipefail
          bash ./scripts/idempotency-test-template.sh 2>&1 | tee .artifacts/idempotency/idempotency-standalone.log

      - name: Verify generated repo idempotency (monorepo-package)
        shell: bash
        env:
          KEEP_IDEMPOTENCY_DIR: "1"
          SCAFFOLD_MODE: "monorepo-package"
          TMPDIR: ${{ github.workspace }}/.artifacts/idempotency/tmp
        run: |
          set -o pipefail
          bash ./scripts/idempotency-test-template.sh 2>&1 | tee .artifacts/idempotency/idempotency-monorepo.log

      - name: Upload idempotency forensics
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: idempotency-forensics-${{ github.run_id }}-${{ github.run_attempt }}
          path: .artifacts/idempotency
          if-no-files-found: ignore
          retention-days: 7
