# pi-extensions-template in System4D terms.
# The L3 Copier template source and npm CLI package that scaffolds Pi extension packages into pi-extensions; not a generated repo.
# Written for the agents that work in and beside this repo: read it before changing what the repo does or how.
# README.md, AGENTS.md and docs/decisions/ hold the long form; keep this file true to the shipped code.
ontology:
  system4d:
    name: "pi-extensions-template"
    version: "0.1"
    container:
      boundary:
        in_scope:
          - "Copier template source for Pi extension packages: copier-template-monorepo-package/ (simple-package, the default, and its monorepo-package alias) and copier-template/ (standalone-repo, legacy opt-in), configured by copier.yml"
          - "The npm package @tryinget/pi-extensions-package-template with two CLIs: bin/new-pi-extension-repo.mjs (scaffold) and bin/npm-bootstrap-publish.mjs (first-time npm publish through a temporary .npmrc), plus the thin wrapper new-pi-extension-repo.sh"
          - "Generated-output contracts in contract/: generated-repo.contract.json, generated-monorepo-package.contract.json and the Pi host contract pi-host-contract.json"
          - "Template-source checks: scripts/template-guardrails.sh, smoke-test-template.sh, generated-contract-test.sh and idempotency-test-template.sh, run for standalone-repo and simple-package"
          - "Batch copier update/recopy of already generated packages (scripts/update-generated-repos.sh) and release automation for the template package itself (release-please, publish.yml)"
        out_of_scope:
          - "Task, direction, decision and evidence state: Agent Kernel (ak) owns it (governance/README.md); docs are projections"
          - "Shared vocabulary: concepts come from the core and company ontology layers in ontology/manifest.yaml; the repo defines its own only where those have none"
          - "Extension product code: each generated package owns it in softwareco/owned/pi-extensions/packages/<name>"
          - "Package check logic for monorepo outputs: the pi-extensions root owns scripts/package-quality-gate.sh; the generated scripts/quality-gate.sh only delegates to it"
          - "Facts owned by Prompt Vault, ROCS, AK runtime, Pi runtime, KES, steward/publication or template propagation: hand off to that owner instead of editing here (AGENTS.md)"
          - "Scaffolding the package-group topology: named in docs/decisions/package-topology-modes.md, not implemented"
      constraints:
        - "Node.js >= 20 (package.json engines) for the CLIs and checks; bash for the scripts; Copier must be installed, and templates use the .jinja suffix"
        - "Template content lives only under copier-template/** and copier-template-monorepo-package/**; template config only in copier.yml and the root wrappers (AGENTS.md)"
        - "Never run copier copy ... . into this repo root; keep the root free of generated artifacts (AGENTS.md)"
        - "Generated packages keep TypeScript 6.0.3 and the Pi host contract (hostBaseline 0.84.3, @earendil-works peers at '*'); the root engineering-core pin move does not authorize a TypeScript 7 migration (docs/engineering.local.md)"
        - "Release-check scripts honor the managed TMPDIR and never copy operator credentials into release scratch (scripts/template-guardrails.sh)"
      edges:
        - name: "Generated Pi extension packages"
          direction: "out"
          protocol: "file"
          system: "softwareco/owned/pi-extensions/packages/<name>, and legacy standalone repos"
          contract: "copier.yml; contract/generated-monorepo-package.contract.json; contract/generated-repo.contract.json"
        - name: "L2 lineage"
          direction: "in"
          protocol: "file"
          system: "tpl-project-repo (L2), recorded as _src_path in the root .copier-answers.yml"
          contract: "docs/decisions/package-first-lineage.md"
        - name: "Root package check delegation"
          direction: "out"
          protocol: "cli"
          system: "pi-extensions scripts/package-quality-gate.sh, found by searching upward or through PACKAGE_QUALITY_GATE_SCRIPT"
          contract: "docs/decisions/package-topology-modes.md"
        - name: "Template package publication"
          direction: "out"
          protocol: "https"
          system: "npm registry (@tryinget/pi-extensions-package-template), through GitHub Actions release-please and trusted publishing"
          contract: "README.md: Template package release automation; .github/workflows/publish.yml"
      dependencies:
        - name: "Agent Kernel (ak)"
          type: "runtime"
          note: "Tasks, direction, decisions and evidence for this repo live in AK, not in markdown; the work-items projection is retired (governance/README.md)"
        - name: "core/ontology-kernel and the softwareco ontology layer"
          type: "build"
          note: "The core and company ontology layers, named in ontology/manifest.yaml (<repo:core/ontology-kernel@main>, <repo:softwareco@main>)"
        - name: "core/rocs-cli"
          type: "build"
          note: "Runs the ontology checks through ./scripts/rocs.sh, which pins the release it accepts (0.4.4)"
        - name: "engineering-core"
          type: "build"
          note: "The pi-ts lane at v0.12.2: policy/engineering-lane.json points at it, docs/engineering.local.md holds the local overrides"
        - name: "Copier"
          type: "build"
          note: "Renders the templates and runs copier update/recopy for generated packages"
        - name: "softwareco/owned/pi-extensions"
          type: "build"
          note: "Owns the root package checks that generated packages delegate to; the workflows pin its validation owner to a fixed commit (scripts/template-guardrails.sh)"
      anti_goals:
        - "Package-local AK wrappers, copied launcher scripts or package-local direction state in generated monorepo packages; direction stays at the monorepo root (AGENTS.md)"
        - "A private full copy of the package checks in monorepo package outputs (docs/decisions/package-topology-modes.md)"
        - "Package-local docs/dev/ trees in generated packages; docs/project/ and docs/adr/ instead (AGENTS.md)"
        - "Leading docs and CLI examples with standalone repo bootstrap (docs/decisions/package-first-lineage.md)"
        - "A blind mass repoint of existing packages onto this source (docs/decisions/package-first-lineage.md)"
        - "A checked-in governance/work-items.json projection (governance/README.md)"
    compass:
      drivers:
        - "The pi-extensions monorepo needs one canonical package-first source for new extension packages that still remembers its tpl-project-repo origin (docs/decisions/package-first-lineage.md)"
        - "The old standalone-repo/monorepo-package wording stressed repo placement when the real distinction is package shape inside the monorepo (docs/decisions/package-topology-modes.md)"
      outcomes:
        - "One command (npm exec new-pi-extension-repo, the wrapper or copier copy) scaffolds a package into pi-extensions/packages/<name> that meets the generated contract and delegates its checks to the pi-extensions root"
        - "Generated packages keep .copier-answers.yml and can follow template releases through copier update --trust, or recopy when update cannot reconcile"
      tradeoffs:
        - decision: "Default scaffold mode"
          chosen: "simple-package, with monorepo-package as an alias and standalone-repo as legacy opt-in"
          because: "The main target is pi-extensions/packages/* (docs/decisions/package-first-lineage.md)"
        - decision: "Track generated metadata in a template repo"
          chosen: "Keep the root .copier-answers.yml tracked"
          because: "It preserves L2 -> L3 lineage to tpl-project-repo (docs/decisions/package-first-lineage.md)"
        - decision: "Where monorepo package checks live"
          chosen: "In the pi-extensions root script; the generated scripts/quality-gate.sh is a thin wrapper"
          because: "Template outputs should not embed a private copy of the check logic (docs/decisions/package-topology-modes.md)"
        - decision: "Release tag shape"
          chosen: "vX.Y.Z tags without the component (include-component-in-tag: false)"
          because: "Keeps the publish trigger logic consistent (README.md)"
    engine:
      triggers:
        - "An operator scaffolds a package with new-pi-extension-repo, new-pi-extension-repo.sh or copier copy"
        - "A template change is committed or pushed: the hooks run npm run check (pre-commit) and npm run check:full (pre-push); .github/workflows/template-guardrails.yml runs in CI"
        - "A push to main updates the release-please PR; a GitHub Release vX.Y.Z runs publish.yml"
        - "An operator runs scripts/update-generated-repos.sh --ref <tag> to move generated packages to a template release"
      states:
        - name: "simple-package"
          meaning: "Preferred live scaffold mode and the default: one package root such as packages/<name>"
        - name: "monorepo-package"
          meaning: "Compatibility alias that renders the same scaffold as simple-package"
        - name: "standalone-repo"
          meaning: "Legacy opt-in mode rendered from copier-template/"
        - name: "package-group"
          meaning: "Intended next topology mode for interlinked packages; not scaffolded yet"
      invariants:
        - id: "PET-INV-001"
          statement: "The root .copier-answers.yml exists and its _src_path points at tpl-project-repo"
          enforcement: "test: scripts/template-guardrails.sh"
        - id: "PET-INV-002"
          statement: "A generated scaffold contains every required path, none of the forbidden template-source paths, and no leaked placeholders"
          enforcement: "test: scripts/generated-contract-test.sh against contract/generated-repo.contract.json and contract/generated-monorepo-package.contract.json"
        - id: "PET-INV-003"
          statement: "Running copier update (or the recopy fallback) on a freshly generated scaffold leaves its repository unchanged"
          enforcement: "test: scripts/idempotency-test-template.sh"
        - id: "PET-INV-004"
          statement: "Both template variants carry the canonical Pi host contract: hostBaseline equals devTestFloor, and the Pi peers stay '*' and come from @earendil-works, never @mariozechner"
          enforcement: "test: scripts/pi-host-contract-parity.mjs and scripts/template-guardrails.sh; generated tests/pi-host-contract.test.mjs"
        - id: "PET-INV-005"
          statement: "Release-check scripts normalize npm pack JSON, honor and export the managed TMPDIR, and never copy operator credentials into release scratch"
          enforcement: "test: scripts/template-guardrails.sh, scripts/npm-pack-json.test.mjs"
        - id: "PET-INV-006"
          statement: ".release-please-manifest.json matches the package.json version, and package.json keeps the bin and files entries the CLIs need"
          enforcement: "test: scripts/template-guardrails.sh"
      lifecycle:
        - "Edit copier-template/**, copier-template-monorepo-package/**, copier.yml or the wrappers"
        - "Run npm run check, then npm run check:full (smoke, generated-contract and idempotency checks for both modes)"
        - "Commit with a Conventional Commit message and push to main; release-please opens or updates the release PR"
        - "Merge the release PR; the GitHub Release vX.Y.Z publishes the package to npm"
        - "Move generated packages forward with copier update --trust from a clean destination (or update-generated-repos.sh), then run npm run check there"
    fog:
      assumptions:
        - id: "PET-A-001"
          statement: "Generated monorepo packages sit inside the pi-extensions tree, so the thin scripts/quality-gate.sh wrapper finds the root script by searching upward"
          how_to_validate: "SCAFFOLD_MODE=simple-package bash ./scripts/smoke-test-template.sh; outside the tree set PACKAGE_QUALITY_GATE_SCRIPT"
        - id: "PET-A-002"
          statement: "A brand-new npm package may still need one token-based publish before npm trusted publishing can be configured (README.md)"
          how_to_validate: "npm-bootstrap-publish --dry-run on the new package, then check the npm package settings"
      risks:
        - id: "PET-R-001"
          statement: "A blind copier copy or recopy from this source rewrites implementation files in packages with local drift (prompt-template-accelerator is the known case)"
          mitigation: "Repoint package by package with backups first; prefer copier update --trust from a clean destination (docs/decisions/package-first-lineage.md)"
        - id: "PET-R-002"
          statement: "Generating from a dirty template checkout bakes uncommitted changes into a scaffold"
          mitigation: "new-pi-extension-repo.sh refuses a dirty template unless ALLOW_DIRTY_TEMPLATE=1; pin PI_TEMPLATE_REF=vX.Y.Z for reproducible generation"
        - id: "PET-R-003"
          statement: "Template output gets treated as the engineering policy source while the pi-extensions root now owns more of the engineering-core validation policy"
          mitigation: "Check the root-versus-local boundary through the surfaces listed in next_session_prompt.md before changing generated engineering-core files"
      exceptions:
        - id: "PET-E-INCIDENT"
          statement: "Incident hotfix allowed"
          reason: "Record Exception immediately and Debt immediately"
      debt:
        - id: "PET-D-001"
          statement: "package-group mode is not scaffolded, and generated docs and contracts do not yet describe root-script delegation everywhere (docs/decisions/package-topology-modes.md: partially implemented)"
          payoff_plan: "Continue phases 2 and 3 of docs/decisions/package-topology-modes.md incrementally"
        - id: "PET-D-002"
          statement: "Whether package-shaped outputs should drop to a reduced engineering-core form (only docs/engineering.local.md) is undecided; outputs still emit policy/engineering-lane.json"
          payoff_plan: "Decide it in the pass next_session_prompt.md describes, after checking the consequences for package checks"
        - id: "PET-D-003"
          statement: "Repointing prompt-template-accelerator onto this L3 source is deferred because its drift would be overwritten"
          payoff_plan: "A dedicated package update pass (docs/decisions/package-first-lineage.md)"
